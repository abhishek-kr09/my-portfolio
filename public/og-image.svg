<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Abhishek Kumar portfolio social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1020" cy="120" r="180" fill="#1d4ed8" opacity="0.15"/>
  <circle cx="220" cy="560" r="220" fill="#059669" opacity="0.12"/>
  <rect x="80" y="72" width="1040" height="486" rx="28" fill="#0b1220" stroke="#1e293b" stroke-width="2"/>

  <text x="140" y="220" fill="#e2e8f0" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="64" font-weight="800">
    Abhishek Kumar
  </text>
  <text x="140" y="284" fill="url(#accent)" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" filter="url(#glow)">
    Full-Stack Developer and AI Enthusiast
  </text>
  <text x="140" y="352" fill="#94a3b8" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500">
    React  Node.js  TypeScript  AI Systems
  </text>

  <rect x="140" y="414" width="220" height="56" rx="28" fill="#f8fafc"/>
  <text x="186" y="450" fill="#0f172a" font-family="Manrope, Segoe UI, Arial, sans-serif" font-size="24" font-weight="800">
    Explore Portfolio
  </text>

  <circle cx="1040" cy="474" r="64" fill="#0f172a" stroke="#1e293b"/>
  <text x="1004" y="488" fill="url(#accent)" font-family="Space Grotesk, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">
    AK
  </text>
</svg>
